<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/Register.css" />
    <title>Register to KhelPoshak</title>
    <!-- milauna baki -->
  </head>
  <body>
    <!-- navigation container -->
    <div class="navContainer">
      <a href="../index.html">
        <div class="logo">
          <img
            src="../resources/Logo_heart-pulse-solid.png"
            alt="beatLogo"
            width="35px"
          />
          <div class="logotext">
            <!-- milauna baki -->
            <b>KhelPoshak</b>
          </div>
        </div>
      </a>
      <nav class="navigation">
        <ul>
          <li><a href="../index.html">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Contact</a></li>
          <li id="Login">
            <a href="Login.html" style="color: rgb(21, 88, 246)">Login</a>
          </li>
          <a href="Register.html"><button>Register</button></a>
        </ul>
      </nav>
    </div>

    <!-- page starts here  -->
    <div class="registerContainer">
      <div class="registerCard">
        <div class="registerHeader">
          <img src="../resources/Logo_heart-pulse-solid.png" alt="HeartPulse" />
          <h3><b>Create an Account</b></h3>
          <p>Fill in the details to get started</p>
        </div>

        <form action="register" method="post" class="registerForm">
          <label>Full Name</label>
          <input
            type="text"
            placeholder="Enter your full name"
            name="fullname"
            required
          />

          <label>Email</label>
          <input
            type="email"
            placeholder="Enter your email"
            name="email"
            required
          />

          <label>Password</label>
          <input
            type="password"
            placeholder="Enter password"
            name="password"
            required
          />

          <label>Confirm Password</label>
          <input
            type="password"
            placeholder="Confirm password"
            name="confirmPassword"
            required
          />

          <button type="submit" class="registerBtn">Register</button>

          <p class="loginText">
            Already have an account? <a href="Login.html">Login here</a>
          </p>
        </form>
      </div>
    </div>
  </body>
</html>
